# Single node VictoriaMetrics, node exporter and Grafana for `make kind-dashboard`. The scrape of
# the agent follows the chart README. kind-local.sh adds the dashboard ConfigMap. Every node of
# the kind cluster has a taint, so each pod tolerates all taints.
apiVersion: v1
kind: Namespace
metadata:
  name: nno-dashboard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: nno-dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nno-dashboard-victoria-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nno-dashboard-victoria-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nno-dashboard-victoria-metrics
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: nno-dashboard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics
  namespace: nno-dashboard
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        kubernetes_cluster_name: nno-local
    scrape_configs:
      - job_name: noisy-neighbour-observer
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
            regex: noisy-neighbour-observer;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [nno-dashboard]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: nno-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      serviceAccountName: victoria-metrics
      tolerations:
        - operator: Exists
      containers:
        - name: victoria-metrics
          image: docker.io/victoriametrics/victoria-metrics:v1.156.0@sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
          args:
            - -promscrape.config=/config/scrape.yml
            - -retentionPeriod=1d
            # Instant queries see the last scrape, so the check needs no extra wait.
            - -search.latencyOffset=0s
          ports:
            - name: http
              containerPort: 8428
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: victoria-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: nno-dashboard
spec:
  selector:
    app: victoria-metrics
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: nno-dashboard
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
          ports:
            - name: metrics
              containerPort: 9100
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: nno-dashboard
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: vm-cluster-kind
        uid: victoria-metrics
        type: victoriametrics-metrics-datasource
        access: proxy
        url: http://victoria-metrics:8428
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: noisy-neighbour
        type: file
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: nno-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          env:
            # A local cluster with no secrets, so anonymous users can view.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Grafana installs the signed plugin from grafana.com before it provisions the datasource.
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: victoriametrics-metrics-datasource@1.0.1
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-provisioning
            items:
              - key: datasource.yaml
                path: datasource.yaml
        - name: providers
          configMap:
            name: grafana-provisioning
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboards
          configMap:
            name: grafana-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: nno-dashboard
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
