[package]
name = "observer"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Per pod run queue latency and noisy neighbour metrics for Kubernetes nodes"
license = "Proprietary"

[[bin]]
name = "noisy-neighbour-observer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
prometheus-client = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Replaces the system allocator, see the global_allocator in src/main.rs.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "0.7"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
