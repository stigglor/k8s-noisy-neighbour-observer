on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the repo to check it out.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # clippy (deny warnings), rustfmt check and the test suite.
  ci:
    name: lint, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same toolchain as the Dockerfile builder and rust-version, so a new stable lint cannot break CI.
      - name: Install Rust (1.94, with clippy and rustfmt)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.94"
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: make ci
        run: make ci

  # Builds the image for both platforms without pushing, so a broken Dockerfile fails the PR.
  image:
    name: image (amd64, arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
