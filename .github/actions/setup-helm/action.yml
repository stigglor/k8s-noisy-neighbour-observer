name: Set up helm
description: Install the pinned helm release after a sha256 check.

# The one helm pin for every workflow, so the release installs the helm that CI validated.
inputs:
  version:
    description: Helm release
    default: v4.2.0
  sha256:
    description: Sha256 of helm-<version>-linux-amd64.tar.gz
    default: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096

runs:
  using: composite
  steps:
    - name: Install helm (${{ inputs.version }})
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        curl -fsSLo "$RUNNER_TEMP/helm.tar.gz" "https://get.helm.sh/helm-${VERSION}-linux-amd64.tar.gz"
        echo "${SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
        sudo install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" /usr/local/bin/helm
        helm version
